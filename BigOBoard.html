<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BigO Board - Algorithm Whiteboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a1a2e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='18' cy='5' r='3'/%3E%3Ccircle cx='6' cy='12' r='3'/%3E%3Ccircle cx='18' cy='19' r='3'/%3E%3Cline x1='8.59' y1='13.51' x2='15.42' y2='17.49'/%3E%3Cline x1='15.41' y1='6.51' x2='8.59' y2='10.49'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #f7f5f2;
            --grid-dot: #c8c4bc;
            --toolbar-bg: #1e1e2e;
            --toolbar-fg: #e8e6e3;
            --toolbar-active: #f97316;
            --toolbar-hover: #2d2d44;
            --toolbar-radius: 12px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
            --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #board {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        #board.pan-tool {
            cursor: grab;
        }
        #board.pan-tool.panning {
            cursor: grabbing;
        }
        #board.text-tool {
            cursor: text;
        }
        #board.eraser-tool {
            cursor: cell;
        }

        /* â”€â”€â”€ Toolbar â”€â”€â”€ */
        #toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--toolbar-bg);
            border-radius: var(--toolbar-radius);
            box-shadow: var(--shadow);
            z-index: 100;
            max-width: calc(100vw - 24px);
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-wrap: nowrap;
        }
        #toolbar::-webkit-scrollbar {
            display: none;
        }

        .tb-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .tb-divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 4px;
            flex-shrink: 0;
        }

        .tb-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--toolbar-fg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, transform 0.1s;
            flex-shrink: 0;
            position: relative;
        }
        .tb-btn:hover {
            background: var(--toolbar-hover);
        }
        .tb-btn:active {
            transform: scale(0.92);
        }
        .tb-btn.active {
            background: var(--toolbar-active);
            color: #fff;
        }
        .tb-btn svg { width: 20px; height: 20px; }
        
        .tb-toggle {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--toolbar-fg);
        }
        .tb-toggle input { display: none; }
        .tb-toggle-slider {
            position: relative; width: 32px; height: 18px;
            background-color: #444; border-radius: 9px; transition: 0.3s;
        }
        .tb-toggle-slider:before {
            content: ''; position: absolute; width: 14px; height: 14px;
            border-radius: 50%; left: 2px; bottom: 2px;
            background-color: #eee; transition: 0.3s;
        }
        .tb-toggle input:checked + .tb-toggle-slider { background-color: var(--toolbar-active); }
        .tb-toggle input:checked + .tb-toggle-slider:before { transform: translateX(14px); }

        .tb-color {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.12s, border-color 0.12s;
            padding: 0;
            background: var(--swatch-color, #000);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }
        .tb-color:hover {
            transform: scale(1.15);
        }
        .tb-color.selected {
            border-color: #fff;
            transform: scale(1.1);
        }

        /* â”€â”€â”€ Tooltip â”€â”€â”€ */
        .tb-btn::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: #111;
            color: #eee;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 5px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s, transform 0.15s;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .tb-btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* â”€â”€â”€ Text Input Overlay â”€â”€â”€ */
        #text-input {
            position: fixed;
            z-index: 200;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            overflow: hidden;
            padding: 0;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1a1a2e;
            line-height: 1.3;
            letter-spacing: 0.01em;
            caret-color: #f97316;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-width: 20px;
            min-height: 20px;
            max-width: 80vw;
        }
        #text-input::placeholder {
            color: #bbb;
        }

        /* â”€â”€â”€ Hint Overlay â”€â”€â”€ */
        #hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #999;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.03em;
            pointer-events: none;
            transition: opacity 1.2s ease;
            z-index: 50;
            text-align: center;
            font-family: var(--font-mono);
        }
        #hint span {
            background: rgba(255, 255, 255, 0.7);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
        }
        #hint.fade {
            opacity: 0;
        }

        /* â”€â”€â”€ Zoom indicator â”€â”€â”€ */
        #zoom-indicator {
            position: fixed;
            top: 16px;
            right: 16px;
            font-size: 12px;
            color: #888;
            font-family: var(--font-mono);
            background: rgba(255, 255, 255, 0.65);
            padding: 4px 10px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 50;
            letter-spacing: 0.05em;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }

        /* â”€â”€â”€ Responsive â”€â”€â”€ */
        @media (max-width: 600px) {
            #toolbar {
                bottom: 12px;
                padding: 6px 8px;
                gap: 3px;
                border-radius: 10px;
            }
            .tb-btn {
                width: 34px;
                height: 34px;
                border-radius: 7px;
            }
            .tb-btn svg {
                width: 18px;
                height: 18px;
            }
            .tb-color {
                width: 18px;
                height: 18px;
            }
            .tb-divider {
                height: 22px;
                margin: 0 2px;
            }
            #hint {
                bottom: 70px;
                font-size: 11px;
            }
            #zoom-indicator {
                top: 10px;
                right: 10px;
                font-size: 10px;
                padding: 3px 7px;
            }
        }
    </style>
</head>
<body>
    <canvas id="board"></canvas>
    <div id="zoom-indicator">100%</div>
    <div id="hint"><span>âœï¸ Draw &nbsp;Â·&nbsp; ðŸ– Drag to pan &nbsp;Â·&nbsp; ðŸ” Scroll to zoom &nbsp;Â·&nbsp; T for text</span></div>
    <textarea id="text-input" style="display:none;" spellcheck="false"></textarea>

    <div id="toolbar" role="toolbar" aria-label="Drawing tools">
        <!-- Tools -->
        <div class="tb-group" id="tools-group">
            <button class="tb-btn" data-tool="select" data-tip="Select/Move (V)" aria-label="Select tool">

            </button>
            <button class="tb-btn active" data-tool="pan" data-tip="Pan (Space/V)" aria-label="Pan tool">

            </button>
            <button class="tb-btn" data-tool="structure" data-tip="Structure Pen (S)" aria-label="Structure pen">

            <button class="tb-btn" data-tool="detail" data-tip="Detail Pen (D)" aria-label="Detail pen">

            </button>
            <button class="tb-btn" data-tool="accent" data-tip="Accent Pen (A)" aria-label="Accent pen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>
            </button>
            <button class="tb-btn" data-tool="highlighter" data-tip="Highlighter (H)" aria-label="Highlighter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"><line x1="4" y1="12" x2="20" y2="12"/></svg>
            </button>
            <button class="tb-btn" data-tool="rectangle" data-tip="Rectangle (R)" aria-label="Rectangle tool">

            </button>
            <button class="tb-btn" data-tool="arrow" data-tip="Arrow (W)" aria-label="Arrow tool">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
            <button class="tb-btn" data-tool="node" data-tip="Node (N)" aria-label="Node tool">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
            </button>
            <button class="tb-btn" data-tool="text" data-tip="Text (T)" aria-label="Text tool">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            </button>
            <button class="tb-btn" data-tool="eraser" data-tip="Eraser (E)" aria-label="Eraser">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9L3 14a2 2 0 0 1 0-2.8l7.7-7.7a2 2 0 0 1 2.8 0L20 10"/><path d="M7 14l6-6"/><path d="M13 8l6 6"/></svg>
            </button>
        </div>

        <div class="tb-divider"></div>

        <div class="tb-group">
            <label class="tb-toggle" data-tip="Smart Draw Shape Recognition (S)">
                <input type="checkbox" id="toggle-smart-draw" checked>
                <span class="tb-toggle-slider"></span>
                <span style="margin-left: 8px; font-size: 13px; font-weight: 500; user-select: none;">Smart</span>
            </label>
        </div>

        <div class="tb-divider"></div>

        <!-- Colors -->
        <div class="tb-group" id="colors-group">
            <button class="tb-color selected" data-color="#1a1a2e" style="--swatch-color:#1a1a2e" aria-label="Dark color"></button>
            <button class="tb-color" data-color="#4a4a6a" style="--swatch-color:#4a4a6a" aria-label="Gray color"></button>
            <button class="tb-color" data-color="#3b82f6" style="--swatch-color:#3b82f6" aria-label="Blue color"></button>
            <button class="tb-color" data-color="#ef4444" style="--swatch-color:#ef4444" aria-label="Red color"></button>
            <button class="tb-color" data-color="#f97316" style="--swatch-color:#f97316" aria-label="Orange color"></button>
            <button class="tb-color" data-color="#22c55e" style="--swatch-color:#22c55e" aria-label="Green color"></button>
            <button class="tb-color" data-color="#a855f7" style="--swatch-color:#a855f7" aria-label="Purple color"></button>
            <button class="tb-color" data-color="#eab308" style="--swatch-color:#eab308" aria-label="Yellow color"></button>
        </div>

        <div class="tb-divider"></div>

        <!-- History & Clear -->
        <div class="tb-group">
            <button class="tb-btn" id="btn-undo" data-tip="Undo (Ctrl+Z)" aria-label="Undo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
            <button class="tb-btn" id="btn-redo" data-tip="Redo (Ctrl+Y)" aria-label="Redo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
            <button class="tb-btn" id="btn-clear" data-tip="Clear All" aria-label="Clear all">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
        </div>

        <div class="tb-divider"></div>

        <!-- Export -->
        <div class="tb-group">

            </button>
            <button class="tb-btn" id="btn-export-json" data-tip="Export JSON" aria-label="Export JSON">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </button>
        </div>
    </div>

    <script>
(function() {
    // â”€â”€â”€ Constants & Config â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const APP_CONFIG = {
        SNAP_RADIUS: 10,
        ALIGNMENT_TOLERANCE: 5,
        GRID_SIZE: 50,
        SMART_DRAW_THRESHOLD: 40 // distance in screen pixels
    };

    const TOOLS = {
        SELECT: 'select',
        PAN: 'pan',
        STRUCTURE: 'structure',
        DETAIL: 'detail',
        ACCENT: 'accent',
        HIGHLIGHTER: 'highlighter',
        RECTANGLE: 'rectangle',
        ARROW: 'arrow',
        NODE: 'node',
        TEXT: 'text',
        ERASER: 'eraser'
    };

    const TOOL_CONFIG = {
        [TOOLS.STRUCTURE]: { width: 6, alpha: 1, label: 'Structure Pen' },
        [TOOLS.DETAIL]: { width: 2, alpha: 1, label: 'Detail Pen' },
        [TOOLS.ACCENT]: { width: 4.5, alpha: 1, label: 'Accent Pen' },
        [TOOLS.HIGHLIGHTER]: { width: 26, alpha: 0.35, label: 'Highlighter' },
        [TOOLS.RECTANGLE]: { width: 4, alpha: 1, label: 'Rectangle' },
        [TOOLS.ARROW]: { width: 4, alpha: 1, label: 'Arrow' },
        [TOOLS.NODE]: { width: 4, alpha: 1, label: 'Node' },
        [TOOLS.ERASER]: { width: 24, label: 'Eraser' },
        [TOOLS.TEXT]: { fontSize: 16, label: 'Text' },
    };

    const DEFAULT_COLORS = {
        [TOOLS.STRUCTURE]: '#1a1a2e',
        [TOOLS.DETAIL]: '#1a1a2e',
        [TOOLS.ACCENT]: '#f97316',
        [TOOLS.HIGHLIGHTER]: '#eab308',
        [TOOLS.RECTANGLE]: '#1a1a2e',
        [TOOLS.ARROW]: '#1a1a2e',
        [TOOLS.NODE]: '#1a1a2e',
        [TOOLS.TEXT]: '#1a1a2e',
        [TOOLS.ERASER]: '#f7f5f2',
    };

    const MIN_SCREEN_DOT_SPACING = 22;
    const MAX_SCREEN_DOT_SPACING = 80;
    const DOT_RADIUS = 1.5;
    const MAX_UNDO = 100;
    const SAVE_KEY = 'bigoboard-state-v1';

    function genId() { return Date.now() + '_' + Math.random().toString(36).substr(2, 6); }

    // â”€â”€â”€ DOM refs â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const textInput = document.getElementById('text-input');
    const hintEl = document.getElementById('hint');
    const zoomIndicator = document.getElementById('zoom-indicator');
    const undoBtn = document.getElementById('btn-undo');
    const redoBtn = document.getElementById('btn-redo');
    const clearBtn = document.getElementById('btn-clear');
    const smartDrawToggle = document.getElementById('toggle-smart-draw');

    // â”€â”€â”€ State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let elements = [];
    let undoStack = [];
    let redoStack = [];
    
    let currentTool = TOOLS.SELECT;
    let currentColor = DEFAULT_COLORS[TOOLS.STRUCTURE];
    let toolColors = { ...DEFAULT_COLORS };

    let isSmartDrawEnabled = true;

    // View transform
    let viewScale = 1;
    let viewOffsetX = 0;
    let viewOffsetY = 0;

    // Drawing state
    let isDrawing = false;
    let currentStroke = null;
    let isShiftHeld = false;
    let lastEraserPoints = [];

    // Pan state
    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    let panStartOffsetX = 0, panStartOffsetY = 0;
    let isSpacePanning = false;

    // Selection/Move state
    let selectedElementId = null;
    let isDragging = false;
    let dragStartPos = null;
    let dragStartEl = null;
    let snapGuides = []; // Array of {type: 'x'|'y', val: coordinate}

    // Text editing state
    let isEditingText = false;
    let editingTextItem = null;

    // Visual marker state
    let lastMouseX = window.innerWidth / 2;
    let lastMouseY = window.innerHeight / 2;
    let isAltHeld = false;

    // Touch/pinch state
    let isPinching = false;
    let pinchStartDistance = 0, pinchStartScale = 1;
    let pinchMidX = 0, pinchMidY = 0;
    let pointerCache = [];

    let saveTimeout = null;

    // â”€â”€â”€ Initialization â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function init() {
        resizeCanvas();
        loadSavedState();
        isSmartDrawEnabled = smartDrawToggle ? smartDrawToggle.checked : true;
        if (smartDrawToggle) {
            smartDrawToggle.addEventListener('change', (e) => {
                isSmartDrawEnabled = e.target.checked;
            });
        }
        setTool(currentTool);
        updateHistoryButtons();
        updateCanvasCursor();
        updateZoomIndicator();
        render();
        bindEvents();

        setTimeout(() => {
            hintEl.classList.add('fade');
            setTimeout(() => { hintEl.style.display = 'none'; }, 1200);
        }, 6000);
    }

    // â”€â”€â”€ Canvas sizing â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
    }

    function worldToScreen(wx, wy) { return { x: wx * viewScale + viewOffsetX, y: wy * viewScale + viewOffsetY }; }
    function screenToWorld(sx, sy) { return { x: (sx - viewOffsetX) / viewScale, y: (sy - viewOffsetY) / viewScale }; }

    function getVisibleWorldRect() {
        const w = window.innerWidth, h = window.innerHeight;
        const tl = screenToWorld(0, 0), br = screenToWorld(w, h);
        return { left: tl.x, top: tl.y, right: br.x, bottom: br.y, width: br.x - tl.x, height: br.y - tl.y };
    }

    // â”€â”€â”€ Zoom â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function zoomAt(screenX, screenY, factor) {
        const worldX = (screenX - viewOffsetX) / viewScale;
        const worldY = (screenY - viewOffsetY) / viewScale;
        viewScale = Math.max(0.05, Math.min(8, viewScale * factor));
        viewOffsetX = screenX - worldX * viewScale;
        viewOffsetY = screenY - worldY * viewScale;
        updateZoomIndicator();
        render();
    }
    function resetView() {
        viewScale = 1; viewOffsetX = window.innerWidth / 2; viewOffsetY = window.innerHeight / 2;
        updateZoomIndicator(); render();
    }
    function updateZoomIndicator() { zoomIndicator.textContent = Math.round(viewScale * 100) + '%'; }

    // â”€â”€â”€ Grid rendering â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function getGridSpacing() {
        let screenSpacing = APP_CONFIG.GRID_SIZE * viewScale;
        let worldSpacing = APP_CONFIG.GRID_SIZE;
        while (screenSpacing < MIN_SCREEN_DOT_SPACING && worldSpacing < 10000) { worldSpacing *= 2; screenSpacing = worldSpacing * viewScale; }
        while (screenSpacing > MAX_SCREEN_DOT_SPACING && worldSpacing > 1) { worldSpacing /= 2; screenSpacing = worldSpacing * viewScale; }
        return worldSpacing;
    }
    function drawGrid() {
        const spacing = getGridSpacing();
        const visible = getVisibleWorldRect();
        const startX = Math.floor(visible.left / spacing) * spacing;
        const startY = Math.floor(visible.top / spacing) * spacing;
        const dotAlpha = Math.max(0.15, Math.min(0.5, 0.35 * viewScale));
        ctx.fillStyle = `rgba(160, 155, 145, ${dotAlpha})`;
        for (let wx = startX; wx <= visible.right; wx += spacing) {
            for (let wy = startY; wy <= visible.bottom; wy += spacing) {
                const sx = wx * viewScale + viewOffsetX;
                const sy = wy * viewScale + viewOffsetY;
                ctx.beginPath(); ctx.arc(sx, sy, DOT_RADIUS, 0, Math.PI * 2); ctx.fill();
            }
        }
    }

    // â”€â”€â”€ Intersection & Geometry Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function isPointInNode(px, py, node) {
        if (node.shape === 'circle') {
            const radius = node.w / 2;
            return Math.hypot(px - node.x, py - node.y) <= radius;
        } else {
            return px >= node.x && px <= node.x + node.w && py >= node.y && py <= node.y + node.h;
        }
    }
    function isPointInText(px, py, text) {
        const lines = text.text.split('\n');
        const approxW = text.fontSize * 0.6 * Math.max(...lines.map(l => l.length));
        const approxH = lines.length * (text.fontSize * 1.35);
        return px >= text.x && px <= text.x + approxW && py >= text.y && py <= text.y + approxH;
    }
    function getElementAt(wx, wy) {
        for (let i = elements.length - 1; i >= 0; i--) {
            const el = elements[i];
            if (el.type === 'node' && isPointInNode(wx, wy, el)) return el;
            if (el.type === 'text' && isPointInText(wx, wy, el)) return el;
        }
        return null;
    }
    function getPerimeterPoint(node, fromX, fromY, padding = 4) {
        // Ray from node center to (fromX, fromY), find intersection with perimeter.
        let cx, cy;
        if (node.shape === 'circle') {
            cx = node.x; cy = node.y;
            const angle = Math.atan2(fromY - cy, fromX - cx);
            const r = (node.w / 2) + padding;
            return { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r };
        } else {
            cx = node.x + node.w / 2; cy = node.y + node.h / 2;
            const dx = fromX - cx; const dy = fromY - cy;
            const halfW = node.w / 2 + padding; const halfH = node.h / 2 + padding;
            let crossX, crossY;
            if (Math.abs(dx) * halfH > Math.abs(dy) * halfW) {
                // Intersects left/right
                crossX = dx > 0 ? halfW : -halfW;
                crossY = crossX * (dy / dx);
            } else {
                // Intersects top/bottom
                crossY = dy > 0 ? halfH : -halfH;
                crossX = dy === 0 ? 0 : crossY * (dx / dy);
            }
            return { x: cx + crossX, y: cy + crossY };
        }
    }

    // â”€â”€â”€ Rendering â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function drawStroke(targetCtx, stroke) {
        if (!stroke.points || stroke.points.length === 0) return;
        const points = stroke.points;
        targetCtx.save();
        if (stroke.alpha !== undefined && stroke.alpha < 1) targetCtx.globalAlpha = stroke.alpha;
        targetCtx.strokeStyle = stroke.color;
        targetCtx.lineWidth = stroke.width;
        targetCtx.lineCap = 'round';
        targetCtx.lineJoin = 'round';
        
        if (stroke.tool === TOOLS.RECTANGLE && points.length >= 2) {
            const start = points[0], end = points[1];
            targetCtx.strokeRect(start.x, start.y, end.x - start.x, end.y - start.y);
        } else if (stroke.tool === TOOLS.ARROW && points.length >= 2) {
            const start = points[0], end = points[1];
            targetCtx.beginPath(); targetCtx.moveTo(start.x, start.y); targetCtx.lineTo(end.x, end.y);
            const angle = Math.atan2(end.y - start.y, end.x - start.x);
            const headLen = 15 + stroke.width;
            targetCtx.moveTo(end.x, end.y);
            targetCtx.lineTo(end.x - headLen * Math.cos(angle - Math.PI / 6), end.y - headLen * Math.sin(angle - Math.PI / 6));
            targetCtx.moveTo(end.x, end.y);
            targetCtx.lineTo(end.x - headLen * Math.cos(angle + Math.PI / 6), end.y - headLen * Math.sin(angle + Math.PI / 6));
            targetCtx.stroke();
        } else if (stroke.tool === TOOLS.NODE && points.length >= 2) {
            const start = points[0], end = points[1];
            const radius = Math.hypot(end.x - start.x, end.y - start.y);
            targetCtx.beginPath(); targetCtx.arc(start.x, start.y, radius, 0, Math.PI * 2); targetCtx.stroke();
        } else {
            targetCtx.beginPath();
            if (points.length === 1) {
                targetCtx.arc(points[0].x, points[0].y, stroke.width / 2, 0, Math.PI * 2);
                targetCtx.fillStyle = stroke.color; targetCtx.fill(); targetCtx.restore();
                return;
            }
            targetCtx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length - 1; i++) {
                const midX = (points[i].x + points[i + 1].x) / 2;
                const midY = (points[i].y + points[i + 1].y) / 2;
                targetCtx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
            }
            targetCtx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
            targetCtx.stroke();
        }
        targetCtx.restore();
    }

    function drawNode(targetCtx, node) {
        targetCtx.save();
        if (node.alpha !== undefined && node.alpha < 1) targetCtx.globalAlpha = node.alpha;
        targetCtx.strokeStyle = node.color;
        targetCtx.lineWidth = node.width || 4;
        targetCtx.beginPath();
        if (node.shape === 'circle') {
            targetCtx.arc(node.x, node.y, node.w / 2, 0, Math.PI * 2);
        } else {
            targetCtx.rect(node.x, node.y, node.w, node.h);
        }
        targetCtx.stroke();
        if (selectedElementId === node.id) {
            targetCtx.strokeStyle = '#3b82f6';
            targetCtx.lineWidth = 1;
            targetCtx.setLineDash([5, 5]);
            targetCtx.stroke();
        }
        targetCtx.restore();
    }

    function drawEdge(targetCtx, edge) {
        const startNode = elements.find(el => el.id === edge.startNodeId);
        const endNode = elements.find(el => el.id === edge.endNodeId);
        if (!startNode || !endNode) return;

        let scx = startNode.shape === 'circle' ? startNode.x : startNode.x + startNode.w / 2;
        let scy = startNode.shape === 'circle' ? startNode.y : startNode.y + startNode.h / 2;
        let ecx = endNode.shape === 'circle' ? endNode.x : endNode.x + endNode.w / 2;
        let ecy = endNode.shape === 'circle' ? endNode.y : endNode.y + endNode.h / 2;

        const startPt = getPerimeterPoint(startNode, ecx, ecy);
        const endPt = getPerimeterPoint(endNode, scx, scy, edge.arrowhead ? 15 : 4);

        targetCtx.save();
        targetCtx.strokeStyle = edge.color;
        targetCtx.lineWidth = edge.width || 4;
        targetCtx.beginPath();
        targetCtx.moveTo(startPt.x, startPt.y);
        targetCtx.lineTo(endPt.x, endPt.y);
        targetCtx.stroke();

        if (edge.arrowhead) {
            const angle = Math.atan2(endPt.y - startPt.y, endPt.x - startPt.x);
            const headLen = 15 + targetCtx.lineWidth;
            targetCtx.beginPath();
            targetCtx.moveTo(endPt.x, endPt.y);
            targetCtx.lineTo(endPt.x - headLen * Math.cos(angle - Math.PI / 6), endPt.y - headLen * Math.sin(angle - Math.PI / 6));
            targetCtx.moveTo(endPt.x, endPt.y);
            targetCtx.lineTo(endPt.x - headLen * Math.cos(angle + Math.PI / 6), endPt.y - headLen * Math.sin(angle + Math.PI / 6));
            targetCtx.stroke();
        }
        targetCtx.restore();
    }

    function drawTextItem(targetCtx, item) {
        targetCtx.save();
        targetCtx.font = `${item.fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif`;
        targetCtx.fillStyle = item.color;
        targetCtx.textAlign = 'left';
        targetCtx.textBaseline = 'top';
        const lines = item.text.split('\n');
        const lineHeight = item.fontSize * 1.35;
        lines.forEach((line, i) => { targetCtx.fillText(line, item.x, item.y + i * lineHeight); });
        
        if (selectedElementId === item.id) {
            const approxW = item.fontSize * 0.6 * Math.max(...lines.map(l => l.length));
            const approxH = lines.length * lineHeight;
            targetCtx.strokeStyle = '#3b82f6';
            targetCtx.lineWidth = 1;
            targetCtx.setLineDash([5, 5]);
            targetCtx.strokeRect(item.x - 2, item.y - 2, approxW + 4, approxH + 4);
        }
        targetCtx.restore();
    }

    function render() {
        const w = window.innerWidth, h = window.innerHeight;
        ctx.fillStyle = '#f7f5f2'; ctx.fillRect(0, 0, w, h);
        drawGrid();

        ctx.save();
        ctx.translate(viewOffsetX, viewOffsetY);
        ctx.scale(viewScale, viewScale);

        // Draw elements in order: strokes, edges, nodes, texts
        for (const el of elements) {
            if (el.type === 'stroke') drawStroke(ctx, el);
            else if (el.type === 'edge') drawEdge(ctx, el);
        }
        for (const el of elements) {
            if (el.type === 'node') drawNode(ctx, el);
            else if (el.type === 'text') drawTextItem(ctx, el);
        }
        
        if (currentStroke && currentStroke.points.length > 0) {
            drawStroke(ctx, currentStroke);
        }

        // Draw Snap Guides
        if (snapGuides.length > 0) {
            ctx.save();
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 1 / viewScale;
            ctx.beginPath();
            const vis = getVisibleWorldRect();
            for (const guide of snapGuides) {
                if (guide.type === 'x') { ctx.moveTo(guide.val, vis.top); ctx.lineTo(guide.val, vis.bottom); }
                if (guide.type === 'y') { ctx.moveTo(vis.left, guide.val); ctx.lineTo(vis.right, guide.val); }
            }
            ctx.stroke();
            ctx.restore();
        }

        ctx.restore();

        // Visual marker
        if (isAltHeld) {
            ctx.save();
            ctx.beginPath();
            if (currentTool === TOOLS.TEXT) {
                const fontSize = TOOL_CONFIG[TOOLS.TEXT].fontSize || 16;
                const screenFontSize = fontSize * viewScale;
                ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5;
                ctx.moveTo(lastMouseX, lastMouseY); ctx.lineTo(lastMouseX, lastMouseY + screenFontSize);
                ctx.moveTo(lastMouseX - 4, lastMouseY); ctx.lineTo(lastMouseX + 4, lastMouseY);
                ctx.moveTo(lastMouseX - 4, lastMouseY + screenFontSize); ctx.lineTo(lastMouseX + 4, lastMouseY + screenFontSize);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 0.5; ctx.stroke();
            } else if (![TOOLS.PAN, TOOLS.SELECT].includes(currentTool)) {
                const width = getToolWidth(currentTool) * viewScale;
                ctx.arc(lastMouseX, lastMouseY, width / 2, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 0.5; ctx.stroke();
            }
            ctx.restore();
        }
    }

    // â”€â”€â”€ Creating / Updating â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function createStroke(tool, color, width, alpha) {
        return { id: genId(), type: 'stroke', tool, color, width, alpha: alpha !== undefined ? alpha : 1, points: [] };
    }
    function addPointToStroke(stroke, x, y) {
        if ([TOOLS.RECTANGLE, TOOLS.ARROW, TOOLS.NODE].includes(stroke.tool)) {
            if (stroke.points.length === 0) stroke.points.push({ x, y });
            else if (stroke.points.length === 1) stroke.points.push({ x, y });
            else stroke.points[1] = { x, y };
        } else if (isShiftHeld && stroke.points.length > 0) {
            const first = stroke.points[0];
            stroke.points = [{ x: first.x, y: first.y }, { x, y }];
        } else {
            if (stroke.points.length > 0) {
                const last = stroke.points[stroke.points.length - 1];
                const dist = Math.hypot(x - last.x, y - last.y) * viewScale;
                if (dist < 4) return;
            }
            stroke.points.push({ x, y });
        }
    }

    function finalizeStroke() {
        if (!currentStroke || currentStroke.points.length === 0) {
            currentStroke = null; render(); return;
        }

        const pts = currentStroke.points;
        const start = pts[0], end = pts[pts.length - 1];

        // 1. Check for edge connection
        if (currentStroke.tool === TOOLS.STRUCTURE || currentStroke.tool === TOOLS.ARROW || currentStroke.tool === TOOLS.DETAIL) {
            const startNode = elements.find(el => el.type === 'node' && isPointInNode(start.x, start.y, el));
            const endNode = elements.find(el => el.type === 'node' && isPointInNode(end.x, end.y, el));
            if (startNode && endNode && startNode.id !== endNode.id) {
                pushUndoSnapshot();
                elements.push({
                    id: genId(), type: 'edge', startNodeId: startNode.id, endNodeId: endNode.id,
                    color: currentStroke.color, width: currentStroke.width,
                    arrowhead: currentStroke.tool === TOOLS.ARROW
                });
                currentStroke = null; scheduleSave(); render(); return;
            }
        }

        // 2. Smart Draw Recognition (for freehand loops)
        if (isSmartDrawEnabled && currentStroke.points.length > 10 && ![TOOLS.RECTANGLE, TOOLS.ARROW, TOOLS.NODE].includes(currentStroke.tool)) {
            const dist = Math.hypot(end.x - start.x, end.y - start.y) * viewScale;
            if (dist < APP_CONFIG.SMART_DRAW_THRESHOLD) {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                pts.forEach(p => {
                    if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
                    if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
                });
                const w = maxX - minX, h = maxY - minY;
                
                let sumDistToBox = 0;
                let sumDistToCenter = 0;
                const cx = minX + w/2, cy = minY + h/2;
                
                pts.forEach(p => {
                    const dX = Math.min(Math.abs(p.x - minX), Math.abs(maxX - p.x));
                    const dY = Math.min(Math.abs(p.y - minY), Math.abs(maxY - p.y));
                    sumDistToBox += Math.min(dX, dY);
                    sumDistToCenter += Math.hypot(p.x - cx, p.y - cy);
                });
                
                const avgDistToBox = sumDistToBox / pts.length;
                const avgDistToCenter = sumDistToCenter / pts.length;
                const diag = Math.hypot(w, h) || 1;
                const r = Math.max(w, h) / 2 || 1;
                
                const circleError = Math.abs(avgDistToCenter - r) / r;
                const rectError = avgDistToBox / diag;
                const aspect = Math.max(w/h, h/w);

                let recognizedShape = null;
                const isSquareEnough = aspect < 1.35;
                
                if (rectError < 0.10 && (!isSquareEnough || rectError < circleError)) {
                    recognizedShape = 'rectangle';
                } else if (isSquareEnough && circleError < 0.15) {
                    recognizedShape = 'circle';
                }

                if (recognizedShape) {
                    pushUndoSnapshot();
                    if (recognizedShape === 'circle') {
                        elements.push({ id: genId(), type: 'node', shape: 'circle', x: cx, y: cy, w: r*2, h: r*2, color: currentStroke.color, width: currentStroke.width });
                    } else {
                        elements.push({ id: genId(), type: 'node', shape: 'rectangle', x: minX, y: minY, w: w, h: h, color: currentStroke.color, width: currentStroke.width });
                    }
                    currentStroke = null; scheduleSave(); render(); return;
                }
            }
        }

        // 3. Regular Stroke / Geometric Tools
        pushUndoSnapshot();
        if (currentStroke.tool === TOOLS.NODE) {
            const radius = Math.hypot(end.x - start.x, end.y - start.y);
            elements.push({ id: genId(), type: 'node', shape: 'circle', x: start.x, y: start.y, w: radius*2, h: radius*2, color: currentStroke.color, width: currentStroke.width });
        } else if (currentStroke.tool === TOOLS.RECTANGLE) {
            elements.push({ id: genId(), type: 'node', shape: 'rectangle', x: Math.min(start.x, end.x), y: Math.min(start.y, end.y), w: Math.abs(end.x - start.x), h: Math.abs(end.y - start.y), color: currentStroke.color, width: currentStroke.width });
        } else {
            elements.push(currentStroke);
        }
        currentStroke = null; scheduleSave(); render();
    }

    // â”€â”€â”€ Undo/Redo & Save â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function pushUndoSnapshot() {
        undoStack.push({ elements: JSON.parse(JSON.stringify(elements)) });
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack = []; updateHistoryButtons();
    }
    function undo() {
        if (undoStack.length === 0) return;
        redoStack.push({ elements: JSON.parse(JSON.stringify(elements)) });
        const state = undoStack.pop();
        elements = state.elements; currentStroke = null; isDrawing = false;
        updateHistoryButtons(); render(); scheduleSave();
    }
    function redo() {
        if (redoStack.length === 0) return;
        undoStack.push({ elements: JSON.parse(JSON.stringify(elements)) });
        const state = redoStack.pop();
        elements = state.elements; currentStroke = null; isDrawing = false;
        updateHistoryButtons(); render(); scheduleSave();
    }
    function updateHistoryButtons() {
        undoBtn.style.opacity = undoStack.length > 0 ? 1 : 0.35; undoBtn.style.pointerEvents = undoStack.length > 0 ? 'auto' : 'none';
        redoBtn.style.opacity = redoStack.length > 0 ? 1 : 0.35; redoBtn.style.pointerEvents = redoStack.length > 0 ? 'auto' : 'none';
    }
    function clearAll() {
        if (elements.length === 0) return;
        if (!confirm('Clear the entire board?')) return;
        pushUndoSnapshot(); elements = []; currentStroke = null; isDrawing = false;
        render(); scheduleSave();
    }

    function scheduleSave() {
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify({ elements, viewScale, viewOffsetX, viewOffsetY, toolColors }));
            } catch (e) {}
        }, 400);
    }

    function loadSavedState() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            
            // Migration logic for v1 legacy strokes/texts
            if (data.strokes || data.texts) {
                elements = [];
                if (data.strokes) elements.push(...data.strokes);
                if (data.texts) elements.push(...data.texts.map(t => ({ ...t, type: 'text' })));
            } else if (data.elements) {
                elements = data.elements;
            }
            if (typeof data.viewScale === 'number') viewScale = data.viewScale;
            if (typeof data.viewOffsetX === 'number') viewOffsetX = data.viewOffsetX;
            if (typeof data.viewOffsetY === 'number') viewOffsetY = data.viewOffsetY;
            if (data.toolColors) toolColors = { ...DEFAULT_COLORS, ...data.toolColors };
            updateZoomIndicator();
        } catch (e) {}
    }

    // â”€â”€â”€ Export JSON/PNG â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function exportJSON() {
        const data = { elements, viewScale, viewOffsetX, viewOffsetY, toolColors };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `bigoboard_${Date.now()}.json`;
        a.click(); URL.revokeObjectURL(url);
    }

    function exportPNG() {
        if (elements.length === 0) return;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        elements.forEach(el => {
            if (el.type === 'stroke') {
                el.points.forEach(p => {
                    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
                    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
                });
            } else if (el.type === 'node') {
                const nx = el.shape === 'circle' ? el.x - el.w/2 : el.x;
                const ny = el.shape === 'circle' ? el.y - el.h/2 : el.y;
                minX = Math.min(minX, nx); minY = Math.min(minY, ny);
                maxX = Math.max(maxX, nx + el.w); maxY = Math.max(maxY, ny + el.h);
            } else if (el.type === 'text') {
                minX = Math.min(minX, el.x); minY = Math.min(minY, el.y);
                const lines = el.text.split('\n');
                const approxW = el.fontSize * 0.6 * Math.max(...lines.map(l => l.length));
                const approxH = lines.length * (el.fontSize * 1.35);
                maxX = Math.max(maxX, el.x + approxW); maxY = Math.max(maxY, el.y + approxH);
            }
        });
        const padding = 50;
        minX -= padding; minY -= padding; maxX += padding; maxY += padding;
        const width = maxX - minX, height = maxY - minY;
        const exportCanvas = document.createElement('canvas'); exportCanvas.width = width; exportCanvas.height = height;
        const eCtx = exportCanvas.getContext('2d');
        eCtx.fillStyle = '#f7f5f2'; eCtx.fillRect(0, 0, width, height);
        eCtx.translate(-minX, -minY);
        
        elements.forEach(el => {
            if (el.type === 'stroke') drawStroke(eCtx, el);
            else if (el.type === 'edge') drawEdge(eCtx, el);
        });
        elements.forEach(el => {
            if (el.type === 'node') drawNode(eCtx, el);
            else if (el.type === 'text') drawTextItem(eCtx, el);
        });
        
        const a = document.createElement('a'); a.href = exportCanvas.toDataURL('image/png'); a.download = `bigoboard_${Date.now()}.png`; a.click();
    }

    // â”€â”€â”€ Eraser â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function eraseAtPoints(points, eraserRadius) {
        // Simplified eraser for now, just filtering out elements based on bounding boxes or points
        const toRemove = new Set();
        for (const el of elements) {
            for (const ep of points) {
                if (el.type === 'node') {
                    if (isPointInNode(ep.x, ep.y, el)) toRemove.add(el.id);
                } else if (el.type === 'text') {
                    if (isPointInText(ep.x, ep.y, el)) toRemove.add(el.id);
                } else if (el.type === 'edge') {
                    toRemove.add(el.id); // Removing edges is tricky without hit testing the ray, just leave it simple or rely on deleting nodes (which orphans them... wait we need to delete orphaned edges)
                } else if (el.type === 'stroke') {
                    for (const pt of el.points) {
                        if (Math.hypot(ep.x - pt.x, ep.y - pt.y) < eraserRadius) { toRemove.add(el.id); break; }
                    }
                }
                if (toRemove.has(el.id)) break;
            }
        }
        if (toRemove.size > 0) {
            pushUndoSnapshot();
            elements = elements.filter(el => !toRemove.has(el.id));
            // Remove orphaned edges
            const nodeIds = new Set(elements.filter(e => e.type === 'node').map(n => n.id));
            elements = elements.filter(el => el.type !== 'edge' || (nodeIds.has(el.startNodeId) && nodeIds.has(el.endNodeId)));
            scheduleSave();
        }
    }

    // â”€â”€â”€ Text editing â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function startTextEditing(worldX, worldY) {
        const fontSize = TOOL_CONFIG[TOOLS.TEXT].fontSize || 16;
        const screenPos = worldToScreen(worldX, worldY);
        textInput.style.display = 'block'; textInput.value = '';
        textInput.style.left = screenPos.x + 'px'; textInput.style.top = screenPos.y + 'px';
        textInput.style.fontSize = (fontSize * viewScale) + 'px'; textInput.style.color = toolColors[TOOLS.TEXT] || '#1a1a2e';
        textInput.style.width = 'auto'; textInput.style.height = 'auto';
        editingTextItem = { worldX, worldY, fontSize, color: toolColors[TOOLS.TEXT] || '#1a1a2e' };
        isEditingText = true;
        textInput.addEventListener('input', autoResizeTextarea); autoResizeTextarea(); textInput.focus();
    }
    function autoResizeTextarea() {
        textInput.style.height = 'auto'; textInput.style.height = textInput.scrollHeight + 'px';
        textInput.style.width = 'auto'; textInput.style.width = (textInput.scrollWidth + 4) + 'px';
    }
    function commitText() {
        if (!isEditingText || !editingTextItem) return;
        const textValue = textInput.value.trim();
        if (textValue.length > 0) {
            pushUndoSnapshot();
            elements.push({ id: genId(), type: 'text', x: editingTextItem.worldX, y: editingTextItem.worldY, text: textValue, fontSize: editingTextItem.fontSize, color: editingTextItem.color });
            scheduleSave();
        }
        cleanupTextEditing(); render();
    }
    function cancelText() { cleanupTextEditing(); render(); }
    function cleanupTextEditing() {
        textInput.style.display = 'none'; textInput.value = '';
        textInput.removeEventListener('input', autoResizeTextarea);
        isEditingText = false; editingTextItem = null;
    }

    // â”€â”€â”€ Tool UI â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function setTool(tool) {
        currentTool = tool;
        if (tool !== TOOLS.TEXT && isEditingText) commitText();
        if (isDrawing) finalizeStroke();
        document.querySelectorAll('.tb-btn[data-tool]').forEach(btn => btn.classList.toggle('active', btn.dataset.tool === currentTool));
        updateColorUI(); updateCanvasCursor();
    }
    function getToolColor(tool) { return toolColors[tool] || DEFAULT_COLORS[tool] || '#1a1a2e'; }
    function getToolWidth(tool) { return TOOL_CONFIG[tool]?.width || 3; }
    function getToolAlpha(tool) { return TOOL_CONFIG[tool]?.alpha !== undefined ? TOOL_CONFIG[tool].alpha : 1; }
    function setColor(color) {
        const activeKey = currentTool === TOOLS.HIGHLIGHTER ? TOOLS.HIGHLIGHTER : currentTool === TOOLS.ERASER ? TOOLS.ERASER : currentTool === TOOLS.TEXT ? TOOLS.TEXT : [TOOLS.STRUCTURE, TOOLS.DETAIL, TOOLS.ACCENT, TOOLS.RECTANGLE, TOOLS.ARROW, TOOLS.NODE].includes(currentTool) ? currentTool : TOOLS.STRUCTURE;
        toolColors[activeKey] = color; currentColor = color; updateColorUI(); scheduleSave();
    }
    function updateColorUI() {
        const activeKey = currentTool === TOOLS.HIGHLIGHTER ? TOOLS.HIGHLIGHTER : currentTool === TOOLS.TEXT ? TOOLS.TEXT : currentTool === TOOLS.ERASER ? TOOLS.ERASER : [TOOLS.STRUCTURE, TOOLS.DETAIL, TOOLS.ACCENT, TOOLS.RECTANGLE, TOOLS.ARROW, TOOLS.NODE].includes(currentTool) ? currentTool : TOOLS.STRUCTURE;
        const activeColor = toolColors[activeKey] || '#1a1a2e';
        document.querySelectorAll('.tb-color').forEach(btn => btn.classList.toggle('selected', btn.dataset.color === activeColor));
    }
    function updateCanvasCursor() {
        canvas.classList.remove('pan-tool', 'panning', 'text-tool', 'eraser-tool');
        if (currentTool === TOOLS.PAN) canvas.classList.add('pan-tool');
        else if (currentTool === TOOLS.TEXT) canvas.classList.add('text-tool');
        else if (currentTool === TOOLS.ERASER) canvas.classList.add('eraser-tool');
        else if (currentTool === TOOLS.SELECT) canvas.style.cursor = 'default';
        else canvas.style.cursor = 'crosshair';
    }

    // â”€â”€â”€ Event Handlers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function getEventPos(e) { const rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }
    function handlePointerDown(e) {
        e.preventDefault();
        const pos = getEventPos(e);
        const worldPos = screenToWorld(pos.x, pos.y);

        if (isEditingText) { commitText(); return; }
        
        if (currentTool === TOOLS.SELECT) {
            const el = getElementAt(worldPos.x, worldPos.y);
            if (el) {
                selectedElementId = el.id;
                isDragging = true;
                dragStartPos = worldPos;
                dragStartEl = { ...el };
                pushUndoSnapshot(); // Save before move
            } else {
                selectedElementId = null;
            }
            render();
            return;
        }

        if (currentTool === TOOLS.PAN) {
            isPanning = true; panStartX = pos.x; panStartY = pos.y; panStartOffsetX = viewOffsetX; panStartOffsetY = viewOffsetY;
            canvas.classList.add('panning'); return;
        }

        if (currentTool === TOOLS.TEXT) { startTextEditing(worldPos.x, worldPos.y); return; }
        
        if (currentTool === TOOLS.ERASER) {
            isDrawing = true; lastEraserPoints = [worldPos]; eraseAtPoints(lastEraserPoints, getToolWidth(TOOLS.ERASER));
            render(); return;
        }

        isDrawing = true;
        currentStroke = createStroke(currentTool, getToolColor(currentTool), getToolWidth(currentTool), getToolAlpha(currentTool));
        currentStroke.points.push(worldPos);
        render();
    }
    
    function handlePointerMove(e) {
        e.preventDefault();
        const pos = getEventPos(e);

        if (isPanning) {
            viewOffsetX = panStartOffsetX + (pos.x - panStartX); viewOffsetY = panStartOffsetY + (pos.y - panStartY);
            render(); return;
        }

        if (isDragging && selectedElementId) {
            const worldPos = screenToWorld(pos.x, pos.y);
            const dx = worldPos.x - dragStartPos.x;
            const dy = worldPos.y - dragStartPos.y;
            const el = elements.find(e => e.id === selectedElementId);
            if (el) {
                el.x = dragStartEl.x + dx;
                el.y = dragStartEl.y + dy;

                // Alignment Snapping
                snapGuides = [];
                let cx = el.shape === 'circle' ? el.x : el.x + el.w/2;
                let cy = el.shape === 'circle' ? el.y : el.y + el.h/2;
                
                for (const other of elements) {
                    if (other.type !== 'node' || other.id === el.id) continue;
                    let ocx = other.shape === 'circle' ? other.x : other.x + other.w/2;
                    let ocy = other.shape === 'circle' ? other.y : other.y + other.h/2;
                    
                    if (Math.abs(cx - ocx) < APP_CONFIG.ALIGNMENT_TOLERANCE / viewScale) {
                        el.x += (ocx - cx);
                        snapGuides.push({ type: 'x', val: ocx });
                    }
                    if (Math.abs(cy - ocy) < APP_CONFIG.ALIGNMENT_TOLERANCE / viewScale) {
                        el.y += (ocy - cy);
                        snapGuides.push({ type: 'y', val: ocy });
                    }
                }
            }
            render(); return;
        }

        if (isEditingText) return;

        if (isDrawing && currentTool === TOOLS.ERASER) {
            const worldPos = screenToWorld(pos.x, pos.y);
            lastEraserPoints.push(worldPos); if (lastEraserPoints.length > 20) lastEraserPoints.shift();
            eraseAtPoints([worldPos], getToolWidth(TOOLS.ERASER));
            render(); return;
        }

        if (isDrawing && currentStroke) {
            const worldPos = screenToWorld(pos.x, pos.y);
            addPointToStroke(currentStroke, worldPos.x, worldPos.y);
            render();
        }
    }

    function handlePointerUp(e) {
        e.preventDefault();
        if (isPanning) { isPanning = false; canvas.classList.remove('panning'); return; }
        if (isDragging) { isDragging = false; snapGuides = []; scheduleSave(); render(); return; }
        if (isEditingText) return;
        if (isDrawing && currentTool === TOOLS.ERASER) { isDrawing = false; lastEraserPoints = []; render(); return; }
        if (isDrawing && currentStroke) { finalizeStroke(); }
    }

    function handleWheel(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect(); lastMouseX = e.clientX - rect.left; lastMouseY = e.clientY - rect.top;
        if (e.altKey) {
            isAltHeld = true;
            if (currentTool === TOOLS.TEXT) {
                let size = TOOL_CONFIG[currentTool].fontSize || 16; size = e.deltaY > 0 ? size - 2 : size + 2; size = Math.max(8, Math.min(120, size));
                TOOL_CONFIG[currentTool].fontSize = size;
                if (isEditingText) { textInput.style.fontSize = (size * viewScale) + 'px'; autoResizeTextarea(); }
            } else if (![TOOLS.PAN, TOOLS.SELECT].includes(currentTool)) {
                let width = getToolWidth(currentTool); let step = width >= 10 ? 2 : (width >= 2 ? 1 : 0.5); width = e.deltaY > 0 ? width - step : width + step; width = Math.max(0.5, Math.min(200, width));
                TOOL_CONFIG[currentTool].width = width;
                if (isDrawing && currentStroke) currentStroke.width = width;
            }
            render(); return;
        }
        zoomAt(lastMouseX, lastMouseY, e.deltaY > 0 ? 0.9 : 1.1);
    }

    function handleKeyDown(e) {
        if (isEditingText && e.target === textInput) {
            if (e.key === 'Escape') { e.preventDefault(); cancelText(); }
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
            return;
        }
        const key = e.key.toLowerCase();
        if (e.key === 'Alt') { isAltHeld = true; render(); }
        if (e.ctrlKey || e.metaKey) {
            if (key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
            if (key === 'y') { e.preventDefault(); redo(); return; }
            if (key === '0') { e.preventDefault(); resetView(); return; }
            return;
        }
        switch (key) {
            case 'v': setTool(TOOLS.SELECT); break;
            case 's': setTool(TOOLS.STRUCTURE); break;
            case 'd': setTool(TOOLS.DETAIL); break;
            case 'a': setTool(TOOLS.ACCENT); break;
            case 'h': setTool(TOOLS.HIGHLIGHTER); break;
            case 'r': setTool(TOOLS.RECTANGLE); break;
            case 'w': setTool(TOOLS.ARROW); break;
            case 'n': setTool(TOOLS.NODE); break;
            case 't': setTool(TOOLS.TEXT); break;
            case 'e': setTool(TOOLS.ERASER); break;
            case 'shift': isShiftHeld = true; break;
            case ' ':
                if (!isSpacePanning) { isSpacePanning = true; canvas.classList.add('pan-tool', 'panning'); canvas.style.cursor = 'grabbing'; }
                e.preventDefault(); break;
            case 'backspace':
            case 'delete':
                if (selectedElementId) {
                    pushUndoSnapshot();
                    elements = elements.filter(el => el.id !== selectedElementId);
                    // Remove orphaned edges
                    const nodeIds = new Set(elements.filter(e => e.type === 'node').map(n => n.id));
                    elements = elements.filter(el => el.type !== 'edge' || (nodeIds.has(el.startNodeId) && nodeIds.has(el.endNodeId)));
                    selectedElementId = null;
                    scheduleSave(); render();
                }
                break;
        }
    }

    function handleKeyUp(e) {
        const key = e.key.toLowerCase();
        if (e.key === 'Alt') { isAltHeld = false; render(); }
        if (key === 'shift') isShiftHeld = false;
        if (key === ' ' && isSpacePanning) { isSpacePanning = false; canvas.classList.remove('pan-tool', 'panning'); updateCanvasCursor(); }
    }

    function bindEvents() {
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('keydown', handleKeyDown); window.addEventListener('keyup', handleKeyUp);
        
        canvas.addEventListener('pointerdown', (e) => {
            pointerCache.push(e);
            if (isSpacePanning) return;
            if (pointerCache.length === 2) {
                isPinching = true;
                pinchStartDistance = Math.hypot(pointerCache[0].clientX - pointerCache[1].clientX, pointerCache[0].clientY - pointerCache[1].clientY);
                const rect = canvas.getBoundingClientRect();
                pinchMidX = (pointerCache[0].clientX + pointerCache[1].clientX) / 2 - rect.left;
                pinchMidY = (pointerCache[0].clientY + pointerCache[1].clientY) / 2 - rect.top;
                
                isDrawing = false; isPanning = false; isDragging = false;
                if (currentStroke) finalizeStroke();
                canvas.classList.remove('panning');
                return;
            }
            if (pointerCache.length === 1) handlePointerDown(e);
        });
        
        canvas.addEventListener('pointermove', (e) => {
            const index = pointerCache.findIndex(p => p.pointerId === e.pointerId);
            if (index !== -1) pointerCache[index] = e;

            if (pointerCache.length === 2 && isPinching) {
                const dist = Math.hypot(pointerCache[0].clientX - pointerCache[1].clientX, pointerCache[0].clientY - pointerCache[1].clientY);
                if (pinchStartDistance > 0) {
                    zoomAt(pinchMidX, pinchMidY, dist / pinchStartDistance); 
                    pinchStartDistance = dist;
                }
                return;
            }
            
            const rect = canvas.getBoundingClientRect(); lastMouseX = e.clientX - rect.left; lastMouseY = e.clientY - rect.top;
            if (isAltHeld) render();
            if (isSpacePanning) return;
            if (!isPinching && pointerCache.length === 1) handlePointerMove(e);
        });

        const handlePointerUpEvent = (e) => {
            const index = pointerCache.findIndex(p => p.pointerId === e.pointerId);
            if (index !== -1) pointerCache.splice(index, 1);
            if (pointerCache.length < 2) isPinching = false;
            
            if (pointerCache.length === 0) handlePointerUp(e);
        };
        
        canvas.addEventListener('pointerup', handlePointerUpEvent);
        canvas.addEventListener('pointercancel', handlePointerUpEvent);
        canvas.addEventListener('pointerout', handlePointerUpEvent);
        
        canvas.addEventListener('pointerleave', (e) => {
            handlePointerUpEvent(e);
            if (isDrawing && currentStroke) finalizeStroke();
            if (isPanning) { isPanning = false; canvas.classList.remove('panning'); }
            if (isDragging) { isDragging = false; snapGuides = []; render(); }
        });
        
        canvas.addEventListener('wheel', handleWheel, { passive: false });
        textInput.addEventListener('blur', commitText);
        document.querySelectorAll('.tb-btn[data-tool]').forEach(btn => btn.addEventListener('click', () => setTool(btn.dataset.tool)));
        document.querySelectorAll('.tb-color').forEach(btn => btn.addEventListener('click', () => setColor(btn.dataset.color)));
        undoBtn.addEventListener('click', undo); redoBtn.addEventListener('click', redo); clearBtn.addEventListener('click', clearAll);
        document.getElementById('btn-export-png').addEventListener('click', exportPNG);
        document.getElementById('btn-export-json').addEventListener('click', exportJSON);
        canvas.addEventListener('contextmenu', e => e.preventDefault());
    }

    init();
})();

    </script>
</body>
</html>
